services:
  web:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/storage/berta.db
      CMS_MEDIA_DIR: /app/storage/media
    ports:
      - "127.0.0.1:${BERTA_HTTP_PORT:-3000}:3000"
    volumes:
      - berta-storage:/app/storage
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  berta-storage:
